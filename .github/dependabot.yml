version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - "security"
      - "dependencies"
    # Only auto-PRs for security updates — ignore routine version bumps
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: "/agents"
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - "security"
      - "agents"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
